plugin: hetzner.hcloud.hcloud
token: "{{ lookup('env', 'HCLOUD_TOKEN') }}"
connect_with: private_ipv4

group: hcloud

keyed_groups:
  - key: hcloud_labels.nodeType
    prefix: ""
    separator: ""
compose:
  ansible_host: "hcloud_ipv4 if hcloud_labels.nodeType == 'bastion' else hcloud_private_networks[0].ip"
  ansible_user: ansible
  ansible_ssh_private_key_file: ~/.ssh/k8s-cluster-key
  ansible_ssh_common_args: "'-o ProxyJump=ansible@178.104.46.225' if hcloud_labels.nodeType != 'bastion' else ''"