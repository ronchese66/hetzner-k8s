---
    # --- vars (defined in group_vars/all.yml) --- 
    # kubernetes_repo_version: "v1.35" # stable

    # --- constants --- 
    # selinux_mode: permissive (standart for RHEL-based)
    # kernel_modules: overlay, br_netfilter
    # modules_file: /etc/modules-load.d/k8s.conf
    # timezone: UTC
    # sysctl: net.bridge.bridge-nf-call-iptables=1
    #         net.bridge.bridge-nf-call-ip6tables=1
    #         net.ipv4.ip_forward=1
    # sysctl_file: /etc/sysctl.d/k8s.conf
    # docker_repo_baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    # k8s_repo_baseurl: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/rpm/


- name: Add repositories
  hosts: controlPlane:worker
  tasks:

    - name: Add Docker/containerd repo
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE repo
        baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
        gpgcheck: true
        module_hotfixes: true
        gpgkey: https://download.docker.com/linux/centos/gpg
        enabled: true
    
    - name: Add Kubernetes repo 
      ansible.builtin.yum_repository:
        name: kubernetes 
        description: Kubernetes repo
        baseurl: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version  }}/rpm"
        gpgcheck: true
        module_hotfixes: true
        gpgkey: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/rpm/repodata/repomd.xml.key"
        enabled: true

- name: Configure system
  hosts: controlPlane:worker
  tasks:

    - name: Set hostname by hetzner
      ansible.builtin.hostname:
        name: "{{ inventory_hostname  }}"

    - name: Set timezone to UTC
      community.general.timezone:
        name: UTC
      
    - name: Update packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install utils
      ansible.builtin.dnf:
        name:
          - curl 
          - git
          - net-tools
          - bind-utils
          - tcpdump
          - unzip
          - tar
          - python3-pip
          - python3-packaging
        state: present

- name: Install Helm 
  hosts: controlPlane
  tasks:

    - name: Download Helm archive
      ansible.builtin.get_url:
        url: "{{ helm_url }}"
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: Extract Helm 
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true
        creates: "/tmp/linux-amd64/helm"

    - name: Install Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: /usr/local/sbin/helm
        mode: '0755'
        remote_src: true


- name: SELinux 
  hosts: controlPlane:worker
  tasks:

    - name: Turn SELinux to permissive mode 
      ansible.posix.selinux:
        policy: targeted
        state: permissive

    - name: Persist SELinux permissive in config file 
      ansible.builtin.lineinfile:
        path: /etc/selinux/config
        regexp: '^SELINUX='
        line: 'SELINUX=permissive'

- name: Disable Swap
  hosts: controlPlane:worker
  tasks:

    - name: Disable swap immediately
      ansible.builtin.command:
        cmd: swapoff -a
      changed_when: false

    - name: Remove swap from /etc/fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^\s*([^#].*\s+swap\s+.*)$'
        replace: '# \1'

- name: Kernel modules 
  hosts: controlPlane:worker
  tasks:

    - name: Load overlay module 
      ansible.builtin.modprobe:
        name: overlay 
        state: present

    - name: Load br_netfilter module
      ansible.builtin.modprobe:
        name: br_netfilter
        state: present

    - name: Persist kernel modules in conf file
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

- name: Sysctl 
  hosts: controlPlane:worker
  tasks: 

    - name: Set net.bridge.bridge-nf-call-iptables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true

    - name: Set net.bridge.bridge-nf-call-ip6tables
      ansible.posix.sysctl:
        name: net.bridge.bridge-nf-call-ip6tables
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true

    - name: Set net.ipv4.ip_forward
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true

- name: SSH handering 
  hosts: controlPlane:worker
  tasks:

    - name: Disable root login via SSH 
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        validate: 'sshd -t -f %s'

    - name: Disable password auth
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        validate: 'sshd -t -f %s'

    - name: Reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded
