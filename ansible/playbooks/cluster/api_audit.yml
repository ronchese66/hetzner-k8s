- name: Configure Kubernetes API audit
  hosts: controlPlane

  vars:
    audit_apply: false
    backup_dir: /var/backups/kubernetes/api-audit
    kubeadm_config: /etc/kubernetes/audit-kubeadm.yaml

  tasks:
    - name: Verify audit volume
      ansible.builtin.command:
        cmd: mountpoint -q /var/log/kubernetes/audit
      changed_when: false

    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0700"

    - name: Backup API Server manifest
      ansible.builtin.copy:
        src: /etc/kubernetes/manifests/kube-apiserver.yaml
        dest: "{{ backup_dir }}/kube-apiserver.yaml"
        remote_src: true
        force: false
        mode: "0600"

    - name: Export current ClusterConfiguration
      ansible.builtin.shell: |
        umask 077
        kubectl --kubeconfig=/etc/kubernetes/admin.conf \
          -n kube-system get cm kubeadm-config \
          -o jsonpath='{.data.ClusterConfiguration}' \
          > {{ backup_dir }}/ClusterConfiguration.yaml
      args:
        creates: "{{ backup_dir }}/ClusterConfiguration.yaml"

    - name: Create working kubeadm configuration
      ansible.builtin.copy:
        src: "{{ backup_dir }}/ClusterConfiguration.yaml"
        dest: "{{ kubeadm_config }}"
        remote_src: true
        force: false
        mode: "0600"

    - name: Install Audit Policy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../kubernetes/audit-policy.yaml"
        dest: /etc/kubernetes/audit-policy.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Create volume guard
      ansible.builtin.command:
        cmd: touch /var/log/kubernetes/audit/.volume-ready
        creates: /var/log/kubernetes/audit/.volume-ready

    - name: Check existing audit configuration
      ansible.builtin.command:
        argv:
          - grep
          - -Fq
          - "name: audit-policy-file"
          - /etc/kubernetes/audit-kubeadm.yaml
      register: audit_configured
      changed_when: false
      failed_when: audit_configured.rc not in [0, 1]

    - name: Verify no existing extraArgs or extraVolumes
      ansible.builtin.command:
        cmd: grep -Eq '^  extra(Args|Volumes):' /etc/kubernetes/audit-kubeadm.yaml
      register: existing_extras
      changed_when: false
      failed_when: existing_extras.rc not in [0, 1]
      when: audit_configured.rc == 1

    - name: Verify configuration can be extended safely
      ansible.builtin.assert:
        that:
          - existing_extras.rc == 1
      when: audit_configured.rc == 1

    - name: Configure audit flags and volumes
      ansible.builtin.replace:
        path: "{{ kubeadm_config }}"
        regexp: '(?m)^apiServer:(?:[ \t]*\{\})?[ \t]*$'
        replace: |
          apiServer:
            extraArgs:
              - name: audit-policy-file
                value: /etc/kubernetes/audit-policy.yaml
              - name: audit-log-path
                value: /var/log/kubernetes/audit/audit.log
              - name: audit-log-format
                value: json
              - name: audit-log-maxsize
                value: "512"
              - name: audit-log-maxbackup
                value: "30"
              - name: audit-log-maxage
                value: "7"
              - name: audit-log-compress
                value: "true"
              - name: audit-log-mode
                value: blocking
            extraVolumes:
              - name: api-audit-policy
                hostPath: /etc/kubernetes/audit-policy.yaml
                mountPath: /etc/kubernetes/audit-policy.yaml
                readOnly: true
                pathType: File
              - name: api-audit-logs
                hostPath: /var/log/kubernetes/audit
                mountPath: /var/log/kubernetes/audit
                readOnly: false
                pathType: Directory
              - name: api-audit-guard
                hostPath: /var/log/kubernetes/audit/.volume-ready
                mountPath: /etc/kubernetes/audit-volume-ready
                readOnly: true
                pathType: File
      register: audit_config_update
      when: audit_configured.rc == 1

    - name: Verify audit configuration was updated
      ansible.builtin.assert:
        that:
          - audit_config_update.changed
      when: audit_configured.rc == 1

    - name: Preserve API Server endpoint
      ansible.builtin.blockinfile:
        path: "{{ kubeadm_config }}"
        insertafter: EOF
        marker: "# {mark} kubeadm InitConfiguration"
        block: |
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: 10.0.1.2
            bindPort: 6443

    - name: Validate kubeadm configuration
      ansible.builtin.command:
        cmd: kubeadm config validate --config {{ kubeadm_config }}
      changed_when: false

    - name: Dry-run API Server generation
      ansible.builtin.command:
        cmd: kubeadm init phase control-plane apiserver --config {{ kubeadm_config }} --dry-run
      register: audit_dry_run
      changed_when: false

    - name: Show dry-run result
      ansible.builtin.debug:
        var: audit_dry_run.stdout_lines

    - name: Apply API Server configuration
      ansible.builtin.command:
        cmd: kubeadm init phase control-plane apiserver --config {{ kubeadm_config }}
      when: audit_apply | bool

    - name: Verify API Server readiness
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf get --raw=/readyz
      register: apiserver_ready
      until: apiserver_ready.rc == 0 and 'ok' in apiserver_ready.stdout
      retries: 36
      delay: 5
      changed_when: false
      when: audit_apply | bool

    - name: Verify audit flags
      ansible.builtin.command:
        cmd: grep -F -- --audit-policy-file=/etc/kubernetes/audit-policy.yaml /etc/kubernetes/manifests/kube-apiserver.yaml
      changed_when: false
      when: audit_apply | bool

    - name: Verify audit log
      ansible.builtin.command:
        cmd: test -s /var/log/kubernetes/audit/audit.log
      register: audit_log
      until: audit_log.rc == 0
      retries: 12
      delay: 5
      changed_when: false
      when: audit_apply | bool

    - name: Persist ClusterConfiguration
      ansible.builtin.command:
        cmd: kubeadm init phase upload-config kubeadm --config {{ kubeadm_config }}
      when: audit_apply | bool
