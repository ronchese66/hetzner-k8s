---

# --- vars (defined in group_vars/all/)
# hcloud_token: group_vars/all/secrets.yml (ansible-vault encrypted)
# hcloud_network: "k8sPrivateNet"
#
# --- constants --- 
# secret name: hcloud 
# secret namespace: kube-system
# 
# THIS SECRET IS TEMPORARY!


- name: Create bootstrap secret
  hosts: controlPlane 
  become: false
  tasks:

    - name: Create hcloud secret for CCM bootstrap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: hcloud 
            namespace: kube-system
          type: Opaque
          stringData:
            token: "{{ hcloud_token }}"
            network: "{{ hcloud_network }}"