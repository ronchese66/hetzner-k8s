---

# --- constants ---
# kubeconfig source: /etc/kubernetes/admin.conf (control plane)
# kubeconfig destination: /home/admin/.kube/config (bastion)
# server address: https://cp-main.k8s.internal:6443
#

- name: Copy kubeconfig from control plane to bastion
  hosts: localhost
  connection: local
  tasks:
  
    - name: Create .kube directory for admin user
      ansible.builtin.file:
        path: /home/admin/.kube
        state: directory
        mode: '0755'
        owner: admin
        group: admin

    - name: Fetch kubeconfig from control plane
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: /tmp/admin.conf
        flat: true
      delegate_to: "{{ groups['control_plane'][0] }}"

    - name: Copy kubeconfig to admin user
      ansible.builtin.copy:
        src: /tmp/admin.conf
        dest: /home/admin/.kube/config
        mode: '0600'
        owner: admin
        group: admin

    - name: Update kubeconfig server address
      ansible.builtin.command:
        cmd: kubectl config set-cluster kubernetes --server=https://cp-main.k8s.internal:6443 --kubeconfig=/home/admin/.kube/config
      become: false

    - name: Remove temp kubeconfig
      ansible.builtin.file:
        path: /tmp/admin.conf
        state: absent