
- name: Configure NAT Gateway
  hosts: natGateway
  become: true

  tasks:
    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present
        update_cache: true

    - name: Discover private network interface
      ansible.builtin.command:
        cmd: ip -4 route get 10.0.1.5
      register: nat_private_route
      changed_when: false
      check_mode: false

    - name: Set network interfaces
      ansible.builtin.set_fact:
        nat_private_interface: "{{ nat_private_route.stdout.split(' dev ')[1].split()[0] }}"
        nat_public_interface: "{{ ansible_facts['default_ipv4']['interface'] }}"

    - name: Read private interface addresses
      ansible.builtin.command:
        cmd: "ip -o -4 addr show dev {{ nat_private_interface }}"
      register: nat_private_addresses
      changed_when: false

    - name: Verify NAT network configuration
      ansible.builtin.assert:
        that:
          - nat_private_interface != nat_public_interface
          - "'10.0.1.6/' in nat_private_addresses.stdout"

    - name: Configure kernel networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-nat-gateway.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          net.ipv4.ip_forward = 1
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
      notify: Apply kernel parameters

    - name: Configure SSH hardening
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-nat-gateway.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          AllowUsers ansible
          AllowTcpForwarding no
          AllowAgentForwarding no
          X11Forwarding no
          PermitTunnel no
      notify: Reload SSH

    - name: Validate SSH configuration
      ansible.builtin.command:
        cmd: /usr/sbin/sshd -t
      changed_when: false

    - name: Configure nftables
      ansible.builtin.template:
        src: ../../templates/nftables/nat.conf.j2
        dest: /etc/nftables.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/nft -c -f %s
      notify: Reload nftables

    - name: Enable nftables
      ansible.builtin.systemd_service:
        name: nftables
        enabled: true
        state: started

  handlers:
    - name: Apply kernel parameters
      ansible.builtin.command:
        cmd: sysctl -p /etc/sysctl.d/90-nat-gateway.conf

    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Reload nftables
      ansible.builtin.systemd_service:
        name: nftables
        state: restarted
