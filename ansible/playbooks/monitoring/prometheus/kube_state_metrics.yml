- name: Install kube-state-metrics
  hosts: controlPlane
  tasks:

    - name: Deploy kube-state-metrics
      kubernetes.core.helm:
        release_name: kube-state-metrics
        chart_ref: kube-state-metrics
        chart_repo_url: https://prometheus-community.github.io/helm-charts
        chart_version: "9.1.0"
        release_namespace: kube-system
        kubeconfig: /home/ansible/.kube/config
        binary_path: /usr/local/sbin/helm
        wait: true
        atomic: true
        release_values:
          image:
            tag: v2.20.0
          replicas: 1
          updateStrategy: Recreate
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/hostname: controlplane
          tolerations:
            - key: node.kubernetes.io/network-unavailable
              operator: Exists
              effect: NoSchedule
          rbac:
            create: true
          serviceAccount:
            create: true

    - name: Remove kube-state-metrics Service
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: Service
        name: kube-state-metrics
        namespace: kube-system
        kubeconfig: /home/ansible/.kube/config

    - name: Check Deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kube-state-metrics
        namespace: kube-system
        kubeconfig: /home/ansible/.kube/config
        wait: true
        wait_timeout: 180
        wait_condition:
          type: Available
          status: "True"
      register: deployment

    - name: Check Pods
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: kube-system
        kubeconfig: /home/ansible/.kube/config
        label_selectors:
          - app.kubernetes.io/name=kube-state-metrics
          - app.kubernetes.io/instance=kube-state-metrics
      register: pods

    - name: Check ServiceAccount and RBAC
      kubernetes.core.k8s_info:
        api_version: "{{ item.api_version }}"
        kind: "{{ item.kind }}"
        name: kube-state-metrics
        namespace: "{{ item.namespace | default(omit) }}"
        kubeconfig: /home/ansible/.kube/config
      loop:
        - kind: ServiceAccount
          api_version: v1
          namespace: kube-system
        - kind: ClusterRole
          api_version: rbac.authorization.k8s.io/v1
        - kind: ClusterRoleBinding
          api_version: rbac.authorization.k8s.io/v1
      register: rbac_resources

    - name: Check Service absence
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: kube-state-metrics
        namespace: kube-system
        kubeconfig: /home/ansible/.kube/config
      register: service

    - name: Verify Kubernetes resources
      ansible.builtin.assert:
        that:
          - deployment.resources | length == 1
          - deployment.resources[0].spec.replicas == 1
          - deployment.resources[0].status.readyReplicas | default(0) == 1
          - pods.resources | length == 1
          - pods.resources[0].spec.nodeName == 'controlplane'
          - pods.resources[0].spec.hostNetwork | bool
          - pods.resources[0].status.phase == 'Running'
          - pods.resources[0].status.containerStatuses[0].ready | bool
          - rbac_resources.results | map(attribute='resources') | map('length') | list == [1, 1, 1]
          - service.resources | length == 0

    - name: Verify metrics endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/metrics
        status_code: 200
        return_content: true
        timeout: 10
      register: metrics

    - name: Verify Kubernetes metrics
      ansible.builtin.assert:
        that:
          - "'kube_node_info' in metrics.content"
          - "'kube_pod_info' in metrics.content"
