
---
- name: Install and configure Grafana Alloy
  hosts: controlPlane

  tasks:
    - name: Verify audit volume
      ansible.builtin.command:
        cmd: mountpoint -q /var/log/kubernetes/audit
      changed_when: false

    - name: Configure Grafana repository
      ansible.builtin.yum_repository:
        name: grafana
        description: Grafana
        baseurl: https://rpm.grafana.com
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://rpm.grafana.com/gpg.key
        sslverify: true

    - name: Install Alloy
      ansible.builtin.dnf:
        name: alloy-1.21.3-1
        state: present

    - name: Configure Alloy
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/config.alloy"
        dest: /etc/alloy/config.alloy
        owner: root
        group: alloy
        mode: "0640"
      notify: Restart Alloy

    - name: Create systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/alloy.service.d
        state: directory
        mode: "0755"

    - name: Configure Alloy service permissions
      ansible.builtin.copy:
        dest: /etc/systemd/system/alloy.service.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          User=alloy
          Group=alloy
          AmbientCapabilities=CAP_DAC_READ_SEARCH
          CapabilityBoundingSet=CAP_DAC_READ_SEARCH
          NoNewPrivileges=true
          ProtectSystem=strict
          ReadWritePaths=/var/lib/alloy
      notify: Restart Alloy

    - name: Validate Alloy configuration
      ansible.builtin.command:
        cmd: /usr/bin/alloy validate /etc/alloy/config.alloy
      changed_when: false

    - name: Apply configuration changes
      ansible.builtin.meta: flush_handlers

    - name: Enable and start Alloy
      ansible.builtin.systemd_service:
        name: alloy
        enabled: true
        state: started
        daemon_reload: true

    - name: Verify Alloy service
      ansible.builtin.command:
        cmd: systemctl is-active alloy
      changed_when: false

    - name: Verify audit events in Loki
      ansible.builtin.uri:
        url: "http://10.0.1.7:3100/loki/api/v1/query_range?query=%7Bjob%3D%22kubernetes-audit%22%7D&limit=1"
        status_code: 200
      register: loki_query
      until: (loki_query.json.data.result | default([])) | length > 0
      retries: 12
      delay: 5
      changed_when: false

  handlers:
    - name: Restart Alloy
      ansible.builtin.systemd_service:
        name: alloy
        state: restarted
        daemon_reload: true
