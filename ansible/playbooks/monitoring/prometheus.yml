- name: Install Prometheus
  hosts: monitoring

  vars:
    version: "3.16.0"
    archive: "prometheus-{{ version }}.linux-amd64"
    install_dir: "/opt/{{ archive }}"

  tasks:

    - name: Install tar
      ansible.builtin.dnf:
        name: tar
        state: present
        
    - name: Download Prometheus
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ version }}/{{ archive }}.tar.gz"
        dest: "/tmp/{{ archive }}.tar.gz"
        checksum: "sha256:68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34"
        mode: "0644"

    - name: Extract Prometheus
      ansible.builtin.unarchive:
        src: "/tmp/{{ archive }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "{{ install_dir }}/prometheus"

    - name: Create configuration directory
      ansible.builtin.file:
        path: /etc/prometheus
        state: directory
        mode: "0755"

    - name: Install alert rules
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/rules/"
        dest: /etc/prometheus/rules/
        mode: "0644"
      notify: Restart Prometheus

    - name: Install configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/prometheus.yaml"
        dest: /etc/prometheus/prometheus.yml
        mode: "0644"
      notify: Restart Prometheus

    - name: Validate configuration
      ansible.builtin.command:
        cmd: "{{ install_dir }}/promtool check config --syntax-only /etc/prometheus/prometheus.yml"
      changed_when: false

    - name: Validate alert rules
      ansible.builtin.command:
        cmd: "{{ install_dir }}/promtool check rules /etc/prometheus/rules/kubernetes.yaml"
      changed_when: false

    - name: Configure systemd
      ansible.builtin.copy:
        dest: /etc/systemd/system/prometheus.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus
          Wants=network-online.target
          After=network-online.target

          [Service]
          DynamicUser=yes
          StateDirectory=prometheus
          LoadCredential=token:/etc/prometheus/kubernetes/token
          LoadCredential=ca.crt:/etc/prometheus/kubernetes/ca.crt
          ExecStart={{ install_dir }}/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/var/lib/prometheus --web.listen-address=127.0.0.1:9090
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart Prometheus

    - name: Enable Prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        state: restarted
        daemon_reload: true
