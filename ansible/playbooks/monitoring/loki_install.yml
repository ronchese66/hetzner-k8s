- name: Install Loki
  hosts: monitoring
  tasks:
    - name: Configure Grafana repository
      ansible.builtin.yum_repository:
        name: grafana
        description: Grafana
        baseurl: https://rpm.grafana.com
        enabled: true
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: https://rpm.grafana.com/gpg.key
        sslverify: true

    - name: Install Loki
      ansible.builtin.dnf:
        name: loki-3.7.10-1
        state: present