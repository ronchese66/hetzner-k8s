
{{- if eq .Values.stage "app" }}
{{- $host := (urlParse .Values.config.SITE_ROOT).host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "healthchecks.fullname" . }}
  labels:
    {{- include "healthchecks.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ required "ingress.clusterIssuer is required" .Values.ingress.clusterIssuer | quote }}
    nginx.org/ssl-redirect: "true"
    nginx.org/http-redirect-code: "308"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ include "healthchecks.fullname" . }}-tls
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "healthchecks.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
